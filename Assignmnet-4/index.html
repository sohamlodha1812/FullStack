<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Employee Registration</h1>
        <p>Register new employees to the organization</p>
    </header>

    <main class="container">
        <h2>Employee Registration Form</h2>

        <form id="employeeForm" novalidate>

            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" placeholder="Enter full name"
                       autocomplete="name" required>
                <small id="nameError" class="error"></small>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" placeholder="Enter email address"
                       autocomplete="email" required>
                <small id="emailError" class="error"></small>
            </div>

            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" placeholder="Enter password"
                       autocomplete="new-password" required>
                <small id="passwordError" class="error"></small>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number *</label>
                <input type="tel" id="phone" placeholder="Enter 10-digit phone number"
                       maxlength="10" inputmode="numeric"
                       autocomplete="tel" required>
                <small id="phoneError" class="error"></small>
            </div>

            <div class="form-group">
                <label for="department">Department *</label>
                <select id="department" required>
                    <option value="">Select Department</option>
                    <option value="IT">IT</option>
                    <option value="HR">Human Resources</option>
                    <option value="Finance">Finance</option>
                    <option value="Marketing">Marketing</option>
                    <option value="Sales">Sales</option>
                </select>
                <small id="departmentError" class="error"></small>
            </div>

            <button type="submit">Register Employee</button>

        </form>

        <div id="successMessage" class="success" role="status"
             aria-live="polite"></div>

        <section class="employees">
            <h2>Registered Employees</h2>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Department</th>
                        </tr>
                    </thead>
                    <tbody id="employeeTable"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
